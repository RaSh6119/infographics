# Setup 3b: the project's own illustration elements (data/icons/Elements/, PNG, made for this
# project in the reference pages' style). Retrieval matches labels against each element's title,
# tags and category, so these descriptions say what each picture shows.
#
# Written from the images, 2026-11-18. After the first dev-set retrieval, tags that matched too
# broadly were removed (dev set only, then frozen): "HIV" from the viruses (they matched every HIV
# label), "PrEP" and "ART" from the pill and pill bottle (the glossary already maps PrEP to pills;
# they pulled pills into "Injectable PrEP"), "Day", "Morning" and "Home" from the window.
# FROZEN 2026-11-18 together with ELEMENTS_MIN_SCORE and ELEMENTS_MARGIN (rag/retrieve.py).
# Changing anything here changes setup 3b: make it a new version and rerun the setup.
# Left out on purpose:
#   text_*.png                  pictures of words; text on a page must be real text
#   icon_*-with-tick-mark.png   axis numbers (0, 200, ... 1,000): also text
#   structure_blue-hrule.png    not a rule: a thumbnail of a whole infographic page
#   icon_table.png              a dark rounded shape; unclear what it shows
# scripts/build_elements_index.py fails if a PNG in the folder is neither listed here nor in
# EXCLUDED below, so a new file can't be skipped silently.

excluded:
  - icon_0-with-tick-mark.png
  - icon_1,000-with-tick-mark.png
  - icon_200-with-tick-mark.png
  - icon_400-with-tick-mark.png
  - icon_600-with-tick-mark.png
  - icon_800-with-tick-mark.png
  - structure_blue-hrule.png
  - icon_table.png

